<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BE:A COMPANY Redux</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">

    <!-- Beacompany 페이지 CSS -->
    <link rel="stylesheet" href="./css/main.css">

    <!-- Swiper JS -->
    <script src="../npm/swiper/swiper-bundle.min.js" defer></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <section class="hero-sec">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="./img/12_인스케이프양양호텔-scaled.jpg" class="pc" alt="인스케이프 양양 호텔">
                            <img src="./img/인스케이프앙앙 _모바일.png" class="mo" alt="인스케이프 양양 호텔 모바일 이미지">
                        </div>
                        <div class="swiper-slide">
                            <img src="./img/순천만.png" class="pc" alt="순천만 프로젝트">
                            <img src="./img/순천만 _모바일.png" class="mo" alt="순천만 프로젝트 모바일 이미지">
                        </div>
                        <div class="swiper-slide">
                        </div>
                    </div>

                    <div class="visual-controls">
                        <button type="button" class="swiper-button-prev" aria-label="이전 슬라이드"></button>
                        <div class="swiper-pagination"></div>
                        <button type="button" class="swiper-button-next" aria-label="다음 슬라이드"></button>
                    </div>

                    <div class="swiper-scrollbar"></div>
                </div>
            </section>
        </main>
        <footer>&copy;</footer>
    </div>

    <script>
        const swiper = new Swiper('.hero-sec .swiper', {
            direction: 'horizontal',
            loop: true,
            pagination: {
                el: '.hero-sec .swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.hero-sec .swiper-button-next',
                prevEl: '.hero-sec .swiper-button-prev',
            },
            scrollbar: {
                el: '.hero-sec .swiper-scrollbar',
                draggable: true,
            },
        });
    </script>
</body>
</html>
