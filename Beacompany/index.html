<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BE:A COMPANY Redux</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="../Beacompany/img/12_인스케이프양양호텔-scaled.jpg" class="pc">
                            <img src="../Beacompany/img/인스케이프앙앙 _모바일.png" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="../Beacompany/img/순천만.png" class="pc">
                            <img src="../Beacompany/img/순천만 _모바일.png" class="mo">
                        </div>
                        <div class="swiper-slide">
                        </div>
                    </div>

                    <div class="visual-controls">
                        <div class="swiper-button-prev">
                            <img src="../Beacompany/img/arrow-left.svg" alt="">
                        </div>
                        <div class="swiper-pagination"></div>
                        <div class="swiper-button-next">
                            <img src="../Beacompany/img/arrow-right.svg" alt="">
                        </div>
                    </div>

                    <div class="swiper-scrollbar"></div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>

    <script>
        const swiper = new Swiper('.hero-sec > .swiper', {
            direction: 'horizontal',
            loop: true,
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
            scrollbar: {
                el: '.swiper-scrollbar',
                draggable: true,
            },
        });
    </script>
</body>
</html>
